[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "halo-local-assistant"
version = "0.1.0"
description = "H.A.L.O. local desktop assistant: separately supervised Brain and Voice"
requires-python = ">=3.11"
dependencies = [
    "websockets>=14,<16",
    "httpx>=0.27",
    "keyring>=25",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
core = []
documents = [
    "pypdfium2>=4",
    "pypdf>=6.16.2,<7",
    "mammoth>=1.9",
    "openpyxl>=3.1",
    "markdownify>=0.13",
]
semantic = ["sqlite-vec>=0.1", "fastembed>=0.3"]
full = ["halo-local-assistant[documents,semantic]"]

[project.scripts]
halo = "halo.cli:main"
halo-brain = "brain.server:main"
halo-voice = "voice.__main__:main"

[dependency-groups]
build = ["pyinstaller==6.22.2"]

[tool.hatch.build.targets.wheel]
packages = ["brain/brain", "voice/voice", "halo"]

[tool.hatch.build]
dev-mode-dirs = ["brain", "voice", "."]

[tool.hatch.build.targets.sdist]
include = ["/brain/brain", "/voice/voice", "/halo", "/pyproject.toml"]
