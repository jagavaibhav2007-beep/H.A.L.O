name: unsigned-desktop-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install uv==0.11.3
      - run: npm ci
        working-directory: ui
      - name: Build full-profile backend and unsigned NSIS installer
        shell: pwsh
        run: ./packaging/build-desktop.ps1
      - name: Verify copied backend without Python on PATH
        shell: pwsh
        run: ./.venv/Scripts/python.exe shared/python_profile_check.py --executable dist/halo-backend.exe --profile full
      - uses: actions/upload-artifact@v4
        with:
          name: halo-windows-x64-unsigned
          if-no-files-found: error
          path: |
            dist/halo-backend.exe
            ui/src-tauri/target/release/bundle/nsis/*.exe
