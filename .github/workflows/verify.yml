name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-2-gate:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked Python dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.11.3
          uv sync --locked --extra full --python ${{ matrix.python-version }}
          uv pip check
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci
      - name: Run the full Phase 0-2 gate
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
        run: ./dev.ps1 -Verify

      - name: Check dependency locks
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: ./scripts/check-locks.ps1
      - name: Audit npm dependencies
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: ./scripts/audit-npm.ps1
      - name: Audit locked Python dependencies
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          python -m pip install pip-audit
          ./scripts/audit-python.ps1
      - name: Audit Rust dependencies
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: |
          cargo install cargo-audit --locked
          cargo audit --file ui/src-tauri/Cargo.lock
      - name: Generate dependency and asset SBOMs
        if: matrix.python-version == '3.12'
        shell: pwsh
        run: ./scripts/generate-sbom.ps1
      - name: Upload verification SBOMs
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: halo-sbom
          if-no-files-found: error
          path: .tmp/sbom/*.cdx.json
