name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phase-2-gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Install locked Python dependencies
        shell: pwsh
        run: |
          python -m pip install uv==0.11.3
          uv sync --locked --extra full --python 3.12
          uv pip check
      - name: Install locked UI dependencies
        working-directory: ui
        run: npm ci
      - name: Run the full Phase 0-2 gate
        shell: pwsh
        env:
          HF_HUB_OFFLINE: "1"
        run: ./dev.ps1 -Verify

      - name: Audit npm dependencies
        working-directory: ui
        run: npm audit --audit-level=high
      - name: Audit locked Python dependencies
        shell: pwsh
        run: |
          python -m pip install pip-audit
          uv export --locked --extra full --no-emit-project --output-file requirements.txt --quiet
          pip-audit --vulnerability-service osv -r requirements.txt --disable-pip --no-deps
